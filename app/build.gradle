plugins { id 'com.android.application' }

/*
 * 作者签名密码：优先环境变量 FOCUSRESTORE_KEY_PASSWORD，其次读取被 .gitignore 忽略的本地密码文件。
 * 正式签名密码不写进公开仓库；该密码文件与 focusrestore-author.p12 需一同备份。
 */
def authorSigningPassword = System.getenv('FOCUSRESTORE_KEY_PASSWORD')
if (!authorSigningPassword) {
    def authorPasswordFile = file('../.android/focusrestore-author.password.txt')
    if (!authorPasswordFile.exists()) {
        throw new GradleException("缺少作者签名密码：请设置 FOCUSRESTORE_KEY_PASSWORD，或恢复 ${authorPasswordFile}")
    }
    authorSigningPassword = authorPasswordFile.text.trim()
}

android {
    namespace 'com.hyperos3.focusrestore'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.hyperos3.focusrestore'
        minSdk 27
        targetSdk 35
        versionCode 299
        versionName '0.38.0'
    }

    signingConfigs {
        authorSigning {
            // ImKani 正式作者签名证书，替代原公开测试证书；证书与密码都在被 .gitignore 忽略的 .android 目录内。
            storeFile file('../.android/focusrestore-author.p12')
            storeType 'PKCS12'
            storePassword authorSigningPassword
            keyAlias 'focusrestore'
            keyPassword authorSigningPassword
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.authorSigning
        }
        release {
            // Release 与 Debug 使用相同签名。
            signingConfig signingConfigs.authorSigning
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "FocusRestore-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    testImplementation 'de.robv.android.xposed:api:82'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
