plugins { id 'com.android.application' }

android {
    namespace 'com.hyperos3.focusrestore'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.hyperos3.focusrestore'
        minSdk 27
        targetSdk 35
        versionCode 152
        versionName '0.19.7'
    }

    signingConfigs {
        preservedDebug {
            // Keep the certificate used by the existing published test APKs.
            storeFile file('../.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.preservedDebug
        }
        release {
            // Sign local release test builds so ADB can install them.
            signingConfig signingConfigs.preservedDebug
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "FocusRestore-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    testImplementation 'de.robv.android.xposed:api:82'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

