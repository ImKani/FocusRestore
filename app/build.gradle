plugins { id 'com.android.application' }

android {
    namespace 'com.hyperos3.focusrestore'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.hyperos3.focusrestore'
        minSdk 27
        targetSdk 35
        versionCode 275
        versionName '0.34.2'
    }

    signingConfigs {
        preservedDebug {
            // ImKani 各版本沿用同一固定证书，Debug 与 Release 可覆盖升级并保留配置。
            storeFile file('../.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.preservedDebug
        }
        release {
            // Release 与 Debug 使用相同签名。
            signingConfig signingConfigs.preservedDebug
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "FocusRestore-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    testImplementation 'de.robv.android.xposed:api:82'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
