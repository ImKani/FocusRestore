pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://api.xposed.info/' }
    }
}
rootProject.name = "FocusRestore"
include(":app")
// Local test helper: posts focus/island notifications with the real field payloads so the module
// can be exercised repeatedly without waiting for a genuine travel notification.
include(":testnotifier")