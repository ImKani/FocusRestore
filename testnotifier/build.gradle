plugins { id 'com.android.application' }

android {
    namespace 'com.hyperos3.focustestnotifier'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.hyperos3.focustestnotifier'
        minSdk 27
        targetSdk 35
        versionCode 4
        versionName '1.0.3'
    }

    signingConfigs {
        // Same preserved test certificate as :app, so both install over each other cleanly.
        preservedDebug {
            storeFile file('../.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.preservedDebug
        }
        release {
            signingConfig signingConfigs.preservedDebug
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "FocusTestNotifier-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}
